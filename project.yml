name: Mote
options:
  bundleIdPrefix: com.mote
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
targets:
  Mote:
    type: application
    platform: macOS
    sources:
      - path: Mote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mote.app
        PRODUCT_NAME: Mote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Mote/Info.plist
      properties:
        CFBundleDisplayName: Mote
        CFBundleName: Mote
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        # 自定义 UTI(没有公共 UTI 的扩展名)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.mote.yaml
            UTTypeDescription: YAML Document
            UTTypeConformsTo: [public.plain-text, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [yaml, yml]
          - UTTypeIdentifier: com.mote.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd]
          - UTTypeIdentifier: com.mote.toml
            UTTypeDescription: TOML Document
            UTTypeConformsTo: [public.plain-text, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [toml]
          - UTTypeIdentifier: com.mote.typescript
            UTTypeDescription: TypeScript Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [ts, tsx, mts, cts]
          - UTTypeIdentifier: com.mote.java
            UTTypeDescription: Java Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [java]
          - UTTypeIdentifier: com.mote.cpp
            UTTypeDescription: C++ Source
            UTTypeConformsTo: [public.c-plus-plus-source, public.source-code]
            UTTypeTagSpecification:
              public.filename-extension: [cpp, cc, cxx, c++, hpp, hh, hxx]
          - UTTypeIdentifier: com.mote.objc
            UTTypeDescription: Objective-C Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [m, mm]
          - UTTypeIdentifier: com.mote.csharp
            UTTypeDescription: C# Source
            UTTypeConformsTo: [public.csharp-source, public.source-code]
            UTTypeTagSpecification:
              public.filename-extension: [cs]
          - UTTypeIdentifier: com.mote.go
            UTTypeDescription: Go Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [go]
          - UTTypeIdentifier: com.mote.rust
            UTTypeDescription: Rust Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [rs]
          - UTTypeIdentifier: com.mote.javascript
            UTTypeDescription: JavaScript Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [js, jsx, mjs, cjs]
          - UTTypeIdentifier: com.mote.kotlin
            UTTypeDescription: Kotlin Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [kt, kts]
          - UTTypeIdentifier: com.mote.scala
            UTTypeDescription: Scala Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [scala, sc]
          - UTTypeIdentifier: com.mote.lua
            UTTypeDescription: Lua Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [lua]
          - UTTypeIdentifier: com.mote.ini
            UTTypeDescription: Configuration File
            UTTypeConformsTo: [public.plain-text, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [ini, cfg, conf]
          - UTTypeIdentifier: com.mote.sql
            UTTypeDescription: SQL Script
            UTTypeConformsTo: [public.plain-text, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [sql]
          - UTTypeIdentifier: com.mote.plist
            UTTypeDescription: Property List
            UTTypeConformsTo: [public.plain-text, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [plist]
          - UTTypeIdentifier: com.mote.properties
            UTTypeDescription: Properties File
            UTTypeConformsTo: [public.plain-text, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [properties]
          - UTTypeIdentifier: com.mote.dart
            UTTypeDescription: Dart Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [dart]
          - UTTypeIdentifier: com.mote.haskell
            UTTypeDescription: Haskell Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [hs]
          - UTTypeIdentifier: com.mote.tex
            UTTypeDescription: LaTeX Source
            UTTypeConformsTo: [public.source-code, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [tex]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Mote Document
            CFBundleTypeRole: Editor
            # Owner: 声明为这些类型的所有者,配合 LaunchServices 设置即可成为默认打开方式
            LSHandlerRank: Owner
            NSDocumentClass: MoteDocument
            LSItemContentTypes:
              - public.plain-text
              - public.text
              - public.source-code
              - public.json
              - public.swift-source
              - public.c-source
              - public.c-header
              - public.c-plus-plus-source
              - public.c-plus-plus-header
              - public.objective-c-source
              - public.objective-c-plus-plus-source
              - public.csharp-source
              - public.go-source
              - public.rust-source
              - public.python-script
              - public.javascript-source
              - public.ruby-script
              - public.php-script
              - public.shell-script
              - public.sql
              - public.html
              - public.xml
              - public.css
              - public.plist
              - public.composite-content
              - com.mote.yaml
              - com.mote.markdown
              - com.mote.toml
              - com.mote.typescript
              - com.mote.java
              - com.mote.cpp
              - com.mote.objc
              - com.mote.csharp
              - com.mote.go
              - com.mote.rust
              - com.mote.javascript
              - com.mote.kotlin
              - com.mote.scala
              - com.mote.lua
              - com.mote.ini
              - com.mote.sql
              - com.mote.plist
              - com.mote.properties
              - com.mote.dart
              - com.mote.haskell
              - com.mote.tex
        LSApplicationCategoryType: public.app-category.developer-tools
